
name: Bug Report
description: Report a bug or unexpected behavior in Project Nucleus.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please provide enough information to reproduce and investigate the issue.

  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      options:
        - Neural Core
        - Tensor Operations
        - Automatic Differentiation
        - Optimizers
        - Language
        - Vision
        - Audio
        - Multimodal
        - Video
        - Training Engine
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps or commands.
      placeholder: |
        1. Initialize the model.
        2. Run the training loop.
        3. Observe the error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Screenshots
      description: Include relevant traceback, logs, or screenshots.
      render: text

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "e.g. 3.12.0"

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Windows 11, Ubuntu, CPU, CUDA"

  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I can reproduce this issue.
          required: true

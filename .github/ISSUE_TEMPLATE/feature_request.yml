
name: Feature Request
description: Suggest a new feature or improvement for Project Nucleus.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        We appreciate your ideas!
        Explain the problem, proposed solution, and expected benefits.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation should this feature address?
      placeholder: Describe the problem.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Target Module
      options:
        - Neural Core
        - Tensor Operations
        - Automatic Differentiation
        - Optimizers
        - Language
        - Vision
        - Audio
        - Multimodal
        - Video
        - Training Engine
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Explain how you think this feature should work.
      placeholder: Describe your proposed implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered alternative approaches?

  - type: textarea
    id: impact
    attributes:
      label: Expected Benefits
      description: How would this improve Project Nucleus?
      placeholder: |
        - Performance improvements
        - Better model capabilities
        - Improved developer experience

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Optional technical suggestions, architecture, or pseudocode.

  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This proposal aligns with the goals of Project Nucleus.
          required: true
